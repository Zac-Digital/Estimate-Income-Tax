name: Functional Testing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/IncomeTax.Presentation.Web/**'
      - 'src/IncomeTax.Presentation.Web.Node/**'
      - 'test/IncomeTax.Presentation.Web.Functional/**'
      - '.github/workflows/functional-testing.yml'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'compose-e2e.yaml'
  push:
    branches:
      - 'main'
    paths:
      - 'src/IncomeTax.Presentation.Web/**'
      - 'src/IncomeTax.Presentation.Web.Node/**'
      - 'test/IncomeTax.Presentation.Web.Functional/**'
      - '.github/workflows/functional-testing.yml'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'compose-e2e.yaml'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions: { }

jobs:
  build-and-test:
    name: Build & Run Functional Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Node.JS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: 'npm'
          cache-dependency-path: './test/IncomeTax.Presentation.Web.Functional/package-lock.json'
          node-version: 26

      - name: Browser Cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: '~/.cache/ms-playwright'
          key: Playwright-${{ runner.os }}-${{ hashFiles('./test/IncomeTax.Presentation.Web.Functional/package-lock.json') }}

      - name: Install Dependencies
        working-directory: ./test/IncomeTax.Presentation.Web.Functional
        run: |
          npm ci --ignore-scripts
          [ "$CACHE_HIT" != "true" ] && npx playwright install --with-deps || npx playwright install-deps
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}

      - name: Run Playwright
        working-directory: ./test/IncomeTax.Presentation.Web.Functional
        run: npx playwright test
        env:
          CI: true

      - name: Upload HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          compression-level: '9'
          if-no-files-found: 'warn'
          name: 'Playwright Report'
          path: './test/IncomeTax.Presentation.Web.Functional/playwright-report'
          retention-days: 7
